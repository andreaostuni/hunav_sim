hunav_evaluator_node:
  ros__parameters:

    # Specify the frecuency of data capture (Hz).
    # value 0.0 indicates that data is captured as the same 
    # freq than data is published.
    frequency: 0.0

    # A .txt file will be created with this name (indicate the full path).
    # If the file already exists, the file will be open
    # and a new line of results will be added at the end
    # of the file. 
    result_file: 'metrics'

    # Body radii (m) used by every metric instead of the radii in the HuNav
    # messages (0.4 m per person, 0.35 m per robot), matching social_evaluation's
    # metrics.yaml. A robot takes the radius of the longest name prefix in
    # robot_radius_names (turtlebot2_1 -> turtlebot2), else robot_radius.
    agent_radius: 0.3
    robot_radius: 0.27
    robot_radius_names: ['turtlebot2', 'jackal']
    robot_radius_values: [0.178, 0.326]

    # Goal tolerance (m) on the robot's centre: time_to_reach_goal stops at the
    # first sample inside it, completed checks the final sample. 0.4 = the Nav2
    # goal checker (xy_goal_tolerance) of gazebo_experiments/config/nav2_params.yaml.
    goal_tolerance: 0.4

    # Under these the robot is not moving (time_not_moving): speed (m/s) and
    # angular speed (rad/s), as in social_evaluation's metrics.yaml.
    min_velocity: 0.08
    min_angular_velocity: 0.01

    # Acceleration and jerk, filtered as in social_evaluation's metrics.yaml:
    # rates over rate_window seconds, values above max_accel (m/s^2) / max_jerk
    # (m/s^3) treated as outliers, then an exponential moving average of time
    # constant smoothing_time seconds. In seconds so 10 Hz and 100 Hz data agree.
    rate_window: 0.5
    max_accel: 2.5
    max_jerk: 2.5
    smoothing_time: 0.949

    # The list of metrics to be computed.
    metrics:
    
      # Pérez-Higueras, N., Caballero, F. & Merino, L. 
      # Teaching Robot Navigation Behaviors to Optimal RRT Planners. 
      # Int.J. of Soc. Robotics 10, 235–249 (2018). https://doi.org/10.1007/s12369-017-0448-1
      time_to_reach_goal: true
      path_length: true
      cumulative_heading_changes: true
      avg_distance_to_closest_person: true
      minimum_distance_to_people: true
      intimate_space_intrusions: true
      personal_space_intrusions: true
      social_space_intrusions: true
      public_space_intrusions: true
      group_intimate_space_intrusions: true
      group_personal_space_intrusions: true
      group_social_space_intrusions: true
      group_public_space_intrusions: true

      # N. Tsoi et al., "SEAN 2.0: Formalizing and Generating Social Situations
      # for Robot Navigation," in IEEE Robotics and Automation Letters, vol. 7,
      # no. 4, pp. 11047-11054, Oct. 2022, doi: 10.1109/LRA.2022.3196783.
      completed: true
      minimum_distance_to_target: true
      final_distance_to_target: true
      robot_on_person_collision: true
      person_on_robot_collision: true
      time_not_moving: true
      
      # SocNavBench: A Grounded Simulation Testing Framework for Evaluating Social Navigation
      #ABHIJAT BISWAS, ALLAN WANG, GUSTAVO SILVERA, AARON STEINFELD, and HENNY AD-MONI, Carnegie Mellon University
      avg_robot_linear_speed: true
      avg_robot_angular_speed: true
      avg_acceleration: true
      avg_overacceleration: true
      
      # Learning a Group-Aware Policy for Robot Navigation
      # Kapil Katyal ∗1,2 , Yuxiang Gao ∗2 , Jared Markowitz 1 , Sara Pohland 3 , Corban Rivera 1 , I-Jeng Wang 1 , Chien-Ming Huang 2 
      avg_pedestrian_velocity: true
      avg_closest_pedestrian_velocity: true

      # metrics based on Social Force Model employed in 
      # different papers
      social_force_on_agents: true
      social_force_on_robot: true
      # social work function employed in this planner:
      # https://github.com/robotics-upo/social_force_window_planner
      social_work: true
      social_work_per_second: true
      obstacle_force_on_robot: true
      obstacle_force_on_agents: true